<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap');
    </style>
  </defs>

  <!-- SLIM MASTERS TRIBUTE — wide horizontal layout -->
  <rect x="0" y="0" width="700" height="200" fill="#006747"/>

  <!-- Wide flat Mt. Tam silhouette — shifted up -->
  <path d="
    M 175 130
    L 190 128 L 206 125 L 222 121 L 238 116
    L 252 111 L 266 105 L 278 100
    L 288 95 L 296 91 L 304 87
    L 310 84 L 314 82 L 318 81
    L 320 81 L 322 82 L 326 84
    L 330 83 L 334 82 L 338 83
    L 342 85 L 348 88 L 356 91
    L 364 93 L 372 94 L 380 94
    L 388 95 L 396 97 L 406 100
    L 416 104 L 428 108 L 440 113
    L 454 118 L 468 123 L 484 127
    L 500 130 L 516 131 L 525 130
    Z
  " fill="#FFC72C" opacity="0.12"/>

  <path d="
    M 175 130
    L 190 128 L 206 125 L 222 121 L 238 116
    L 252 111 L 266 105 L 278 100
    L 288 95 L 296 91 L 304 87
    L 310 84 L 314 82 L 318 81
    L 320 81 L 322 82 L 326 84
    L 330 83 L 334 82 L 338 83
    L 342 85 L 348 88 L 356 91
    L 364 93 L 372 94 L 380 94
    L 388 95 L 396 97 L 406 100
    L 416 104 L 428 108 L 440 113
    L 454 118 L 468 123 L 484 127
    L 500 130 L 516 131 L 525 130
  " fill="none" stroke="#FFC72C" stroke-width="2" stroke-linejoin="round"/>

  <!-- === FLAGSTICK === -->

  <!-- Upper pole: flag down to text -->
  <line x1="348" y1="18" x2="348" y2="48" stroke="#FFC72C" stroke-width="2.5"/>
  <!-- Lower pole: below text down to cup -->
  <line x1="348" y1="80" x2="348" y2="112" stroke="#FFC72C" stroke-width="2.5"/>

  <!-- Waving flag at top -->
  <path d="
    M 348 18
    C 345 19, 340 21, 334 20
    C 328 19, 324 22, 319 21
    L 319 32
    C 324 31, 328 34, 334 33
    C 340 34, 345 32, 348 31
    Z
  " fill="#FFC72C"/>

  <!-- "MILL VALLEY" / "NATIONAL" -->
  <text x="346" y="62" text-anchor="middle"
    font-family="'Libre Baskerville', 'Baskerville', 'ITC New Baskerville', Georgia, serif"
    font-style="italic" font-weight="400"
    font-size="14" fill="#FFC72C" letter-spacing="2.5">MILL VALLEY</text>
  <text x="346" y="78" text-anchor="middle"
    font-family="'Libre Baskerville', 'Baskerville', 'ITC New Baskerville', Georgia, serif"
    font-style="italic" font-weight="400"
    font-size="14" fill="#FFC72C" letter-spacing="2.5">NATIONAL</text>

  <!-- Cut cup mid-mountain -->
  <ellipse cx="348" cy="112" rx="9" ry="3" fill="none" stroke="#FFC72C" stroke-width="2"/>
  <path d="M 339 112 L 342 119 L 345 122 L 348 123 L 351 122 L 354 119 L 357 112"
    fill="none" stroke="#FFC72C" stroke-width="2"/>
  <line x1="348" y1="113" x2="348" y2="122" stroke="#FFC72C" stroke-width="1.5"/>
  <line x1="343" y1="118" x2="353" y2="118" stroke="#FFC72C" stroke-width="1.5"/>

  <!-- WINTER LEAGUE — single line, italic Baskerville -->
  <text x="350" y="175" text-anchor="middle"
    font-family="'Libre Baskerville', 'Baskerville', 'ITC New Baskerville', Georgia, serif"
    font-style="italic" font-weight="400"
    font-size="40" fill="#FFC72C" letter-spacing="8">WINTER LEAGUE</text>

  <!-- Year with flanking dots -->
  <circle cx="280" cy="194" r="2" fill="#FFC72C" opacity="0.4"/>
  <text x="350" y="198" text-anchor="middle"
    font-family="'Libre Baskerville', 'Baskerville', Georgia, serif"
    font-style="italic" font-size="11" fill="#FFC72C" opacity="0.5">2026</text>
  <circle cx="420" cy="194" r="2" fill="#FFC72C" opacity="0.4"/>
</svg>
